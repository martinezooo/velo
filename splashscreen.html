<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Revelo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0b1a16 0%, #0f241d 35%, #103025 65%, #0d1f1a 100%);
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
      opacity: 0;
      animation: fadeIn 0.6s ease-out 0.1s forwards;
    }

    .brand .mark { width: 56px; height: 56px; border-radius: 18px; }

    .brand .wordmark {
      font-size: 34px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #e8f5ef;
    }

    .version {
      margin-top: 8px;
      font-size: 11px;
      letter-spacing: 0.06em;
      color: #5f8a79;
      opacity: 0;
      animation: fadeIn 0.6s ease-out 0.34s forwards;
    }

    .tagline {
      margin-top: 18px;
      font-size: 14px;
      letter-spacing: 0.01em;
      color: #8fbfae;
      opacity: 0;
      animation: fadeIn 0.6s ease-out 0.28s forwards;
    }

    .loader {
      display: flex;
      gap: 6px;
      margin-top: 32px;
      opacity: 0;
      animation: fadeIn 0.6s ease-out 0.4s forwards;
    }

    .loader span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #5fc79f;
      animation: pulse 1.4s ease-in-out infinite;
    }

    .loader span:nth-child(2) { animation-delay: 0.2s; }
    .loader span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40%           { opacity: 1;   transform: scale(1.2); }
    }
  </style>
</head>
<body>
  <!-- Revelo logo — inline SVG, no external dependencies -->
  <div class="brand">
    <svg class="mark" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#6FD48A"/><stop offset="1" stop-color="#2C8A52"/>
        </linearGradient>
        <mask id="m">
          <rect x="286" y="380" width="452" height="286" rx="100" fill="#fff"/>
          <path d="M322 416 Q512 576 702 416" fill="none" stroke="#000" stroke-width="44" stroke-linecap="round"/>
        </mask>
      </defs>
      <rect width="1024" height="1024" rx="320" fill="url(#g)"/>
      <rect x="286" y="380" width="452" height="286" rx="100" fill="#FFFFFF" mask="url(#m)"/>
    </svg>
    <span class="wordmark">Revelo</span>
  </div>

  <p class="tagline">One inbox for all.</p>
  <p class="version">v%APP_VERSION%</p>

  <div class="loader">
    <span></span>
    <span></span>
    <span></span>
  </div>
</body>
</html>
